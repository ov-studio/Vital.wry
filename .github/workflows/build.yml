name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Build: Windows ──────────────────────────────────────────────────────────
  build-windows:
    name: 🏗️ Build / 🪟 Windows (64-bit)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Just
        uses: extractions/setup-just@v1

      - name: Build binaries (release)
        run: just build release

      - name: Build binaries (debug)
        run: just build debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            .build/windows

  # ── Build: Linux ────────────────────────────────────────────────────────────
  # TODO: re-enable once Windows is confirmed working
  # build-linux:
  #   ...

  # ── Build: macOS ────────────────────────────────────────────────────────────
  # TODO: re-enable once Windows is confirmed working
  # build-macos:
  #   ...

  # ── Package ─────────────────────────────────────────────────────────────────
  zip:
    name: 📦 Package
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: .build

      - name: Package artifacts
        run: |
          mkdir -p package/vital.wry
          cp .build/vital.wry.gdextension package/vital.wry/vital.wry.gdextension
          mv .build/windows package/vital.wry/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vital.wry
          path: package
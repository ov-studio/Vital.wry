name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Build: Windows ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Just
        uses: extractions/setup-just@v1

      - name: Build binaries (release)
        run: just build release

      - name: Build binaries (debug)
        run: just build debug

      - name: Debug build output
        shell: bash
        run: |
          echo "=== .build/ structure ==="
          find .build/ -type f | sort || echo "ERROR: .build is empty or missing"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp -r .build/. dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # ── Build: Linux ────────────────────────────────────────────────────────────
  # TODO: re-enable once Windows is confirmed working
  # build-linux:
  #   ...

  # ── Build: macOS ────────────────────────────────────────────────────────────
  # TODO: re-enable once Windows is confirmed working
  # build-macos:
  #   ...

  # ── Release: Collect & Publish ──────────────────────────────────────────────
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: collected/

      - name: Debug collected structure
        run: |
          echo "=== collected/ structure ==="
          find collected/ -maxdepth 3 | sort

      - name: Package artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ ! -d "collected" ] || [ -z "$(ls -A collected 2>/dev/null)" ]; then
            echo "ERROR: No artifacts were downloaded"
            exit 1
          fi
          zip_name="Vital.wry-${TAG}.zip"
          (cd collected && zip -r "${GITHUB_WORKSPACE}/${zip_name}" . \
            --exclude "~*" \
            --exclude "*.TMP" \
            --exclude "*.tmp" \
            --exclude "*.pdb")
          echo "Packaged: $zip_name"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ github.ref_name }}
          name:                   ${{ github.ref_name }}
          generate_release_notes: true
          draft:                  false
          prerelease:             ${{ contains(github.ref_name, '-') }}
          files: "Vital.wry-*.zip"
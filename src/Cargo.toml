[package]
name = "godot_wry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master", features = ["api-4-2"] }
raw-window-handle = "0.6.2"
wry = { version = "0.56.0", features = ["devtools"] }
http = "1.1.0"
lazy_static = "1.5.0"
serde_json = "1.0"
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.1"
x11-dl = "2.21.0"
[target.'cfg(target_os = "windows")'.dependencies]
# Exact versions already in wry 0.56's lock file — single windows-core in graph, no conflicts
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Com",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",       # D3D11_TEXTURE2D_DESC, GetDesc, CreateTexture2D
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Foundation_Numerics",
    "Win32_Graphics_Gdi",
]}
webview2-com = "0.38.2"
